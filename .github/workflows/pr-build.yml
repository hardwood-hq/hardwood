name: PR Build

on:
  pull_request:
    branches: [ main ]

env:
  # Kept in sync with S3ProxyContainers.IMAGE; see cli/s3/parquet-java-compat tests.
  S3PROXY_IMAGE: ghcr.io/hardwood-hq/s3proxy:sha-6597ca59cd5c5fa8ee313e13d349d507cc6090c3

# Every job builds the modules it depends on itself, under `-Dquick`, rather than
# waiting for the job that owns them to finish and publish them as an artifact.
# `-Dquick` skips the tests and the `qa` profile (Error Prone, the license header
# check, import sorting, the enforcer and build-plan checks), which takes the
# dependencies of a job down to seconds, where `build-core` -> `build-s3` ->
# `build-cli` -> `Verify native CLI build` made the last job in that chain wait
# four minutes. The jars are the same either way: `-Dquick` changes what is
# verified, not what is compiled, and every check it skips still runs in the job
# that owns the module. No job therefore needs another, and the build's wall clock
# is its slowest single job rather than the sum of a chain.
#
# `-am` bounds each of these builds to the job's own dependency closure, so a job
# neither compiles nor resolves the dependencies of modules it does not use. The
# two BOMs join the closure explicitly because `-am` does not follow an imported
# BOM. The closure includes the module the job goes on to build for real, and
# building it twice costs a second or two.

# SCRATCH BRANCH, NOT FOR MERGE. Three variants of the native CLI job, run side
# by side so they share a runner pool and a moment in time. Every other job is
# removed so the run costs one runner per variant and nothing queues.

jobs:
  # control: exactly what main-line #1245 runs
  native-control:
    if: github.event_name == 'pull_request'
    name: 'native-control'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Pre-pull s3proxy image in background'
        run: |
          nohup docker pull "$S3PROXY_IMAGE" > /tmp/s3proxy-pull.log 2>&1 &
          disown
          echo "Background pull of $S3PROXY_IMAGE started"

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@03e8abf916fd0e281b2efe7b2da3378bb0a1d085  # v1 — https://github.com/graalvm/setup-graalvm/releases/tag/v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Cache Maven dependencies'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-native-timing-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-cli-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Build the dependencies'
        run: ./mvnw -ntp -B -Dquick install -pl :hardwood-cli,:hardwood-bom,:hardwood-test-bom -am

      - name: 'Build Native Image'
        # -DskipSurefire=true skips the JVM unit test suite, which the `build-cli`
        # job runs. Failsafe still runs during integration-test, and
        # -Dnative clears the `native` tag exclusion, so this covers the native
        # smoke ITs plus the JVM S3 command ITs the `build-cli` job also ran.
        run: ./mvnw -ntp -B -Dnative verify -pl :hardwood-cli -DskipSurefire=true

  # -Dgroups=native, and an explicit image-builder heap
  native-groups-heap:
    if: github.event_name == 'pull_request'
    name: 'native-groups-heap'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Pre-pull s3proxy image in background'
        run: |
          nohup docker pull "$S3PROXY_IMAGE" > /tmp/s3proxy-pull.log 2>&1 &
          disown
          echo "Background pull of $S3PROXY_IMAGE started"

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@03e8abf916fd0e281b2efe7b2da3378bb0a1d085  # v1 — https://github.com/graalvm/setup-graalvm/releases/tag/v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Cache Maven dependencies'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-native-timing-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-cli-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Build the dependencies'
        run: ./mvnw -ntp -B -Dquick install -pl :hardwood-cli,:hardwood-bom,:hardwood-test-bom -am

      - name: 'Build Native Image'
        # -DskipSurefire=true skips the JVM unit test suite, which the `build-cli`
        # job runs. Failsafe still runs during integration-test, and
        # -Dnative clears the `native` tag exclusion, so this covers the native
        # smoke ITs plus the JVM S3 command ITs the `build-cli` job also ran.
        env:
          NATIVE_IMAGE_OPTIONS: '-J-Xmx6g'
        run: ./mvnw -ntp -B -Dnative verify -pl :hardwood-cli -DskipSurefire=true -Dgroups=native

  # -Ob, build-time optimization mode
  native-ob:
    if: github.event_name == 'pull_request'
    name: 'native-ob'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Pre-pull s3proxy image in background'
        run: |
          nohup docker pull "$S3PROXY_IMAGE" > /tmp/s3proxy-pull.log 2>&1 &
          disown
          echo "Background pull of $S3PROXY_IMAGE started"

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@03e8abf916fd0e281b2efe7b2da3378bb0a1d085  # v1 — https://github.com/graalvm/setup-graalvm/releases/tag/v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Cache Maven dependencies'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-native-timing-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-cli-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Build the dependencies'
        run: ./mvnw -ntp -B -Dquick install -pl :hardwood-cli,:hardwood-bom,:hardwood-test-bom -am

      - name: 'Build Native Image'
        # -DskipSurefire=true skips the JVM unit test suite, which the `build-cli`
        # job runs. Failsafe still runs during integration-test, and
        # -Dnative clears the `native` tag exclusion, so this covers the native
        # smoke ITs plus the JVM S3 command ITs the `build-cli` job also ran.
        env:
          NATIVE_IMAGE_OPTIONS: '-Ob'
        run: ./mvnw -ntp -B -Dnative verify -pl :hardwood-cli -DskipSurefire=true
