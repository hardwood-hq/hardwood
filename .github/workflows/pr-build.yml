name: PR Build

on:
  pull_request:
    branches: [ main ]

env:
  # Kept in sync with S3ProxyContainers.IMAGE; see cli/s3/parquet-java-compat tests.
  S3PROXY_IMAGE: ghcr.io/hardwood-hq/s3proxy:sha-6597ca59cd5c5fa8ee313e13d349d507cc6090c3

concurrency:
  # A push that supersedes a run leaves the older one competing with its own
  # replacement for runners. Cancelling it hands those back. It does nothing for two
  # different pull requests running at once, which is the larger source of contention.
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

# Every job builds the modules it depends on itself, under `-Dquick`, rather than
# waiting for the job that owns them to finish and publish them as an artifact.
# `-Dquick` skips the tests and the `qa` profile (Error Prone, the license header
# check, import sorting, the enforcer and build-plan checks), which takes the
# dependencies of a job down to seconds. The jars are the same either way: `-Dquick`
# changes what is verified, not what is compiled, and every check it skips still runs
# in the job that owns the module. No job therefore needs another, and the build's
# wall clock is its slowest single job rather than the sum of a chain.
#
# That slowest job is the native CLI build. The other modules are grouped into as few
# jobs as fit beside it, because each job pays for checkout, JDK setup, the cache
# restore and its dependency build again, and each occupies one of the runners that
# concurrent pull requests compete for. Within a job, a step that does not depend on
# the one before it runs even when that one fails, and each reactor build runs with
# `-fae`, so one red module does not hide the state of another.
#
# `-am` bounds each dependency build to the job's own closure, so a job neither
# compiles nor resolves the dependencies of modules it does not use. The closure
# includes the modules the job goes on to build for real, and building them twice
# costs a second or two. The BOMs the modules import need no place in it: `-am` does
# not follow an imported BOM, but Maven resolves one out of the source tree without
# it having been installed at all.
#
# Jobs restore the Maven cache but never save it. A pull request can restore only
# caches saved on its own ref or on `main`, so a cache saved here serves re-runs of
# this one pull request and takes up space that `main`'s caches and the performance
# test datasets need. `main-build.yml` saves a cache under each job name used here,
# and a job restores the one saved under its own name first. A job added here needs
# a counterpart there that resolves the same dependencies, or every run of it
# downloads what the cache is missing.

jobs:
  build-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Set up Java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5 — https://github.com/actions/setup-java/releases/tag/v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Restore Maven dependencies'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-
            maven-${{ runner.os }}-

      - name: 'Drop any cached Hardwood artifacts'
        # Every job builds its own dependency closure, so a Hardwood jar restored from
        # the cache can only stand in for one the closure failed to build, turning a
        # missing dependency into a silent compile against an earlier run's code.
        # Removing them makes such a gap a build error.
        run: rm -rf ~/.m2/repository/dev/hardwood

      - name: 'Build and install BOMs, test-support, core, avro and parquet-testing-runner'
        # parquet-testing-runner depends on core alone, so it builds here, after core,
        # rather than paying for a job of its own.
        run: ./mvnw -B -fae clean install -pl :hardwood-error-prone-checks,:hardwood-bom,:hardwood-test-bom,:hardwood-test-support,:hardwood-core,:hardwood-avro,:hardwood-parquet-testing-runner

  build-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Pre-pull s3proxy image in background'
        # Start the image download immediately after checkout so it overlaps
        # with setup-java, the Maven cache restore and the dependency build.
        # By the time Testcontainers reaches `s3.start()`, layers are cached.
        run: |
          nohup docker pull "$S3PROXY_IMAGE" > /tmp/s3proxy-pull.log 2>&1 &
          disown
          echo "Background pull of $S3PROXY_IMAGE started"

      - name: 'Set up Java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5 — https://github.com/actions/setup-java/releases/tag/v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Restore Maven dependencies'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Drop any cached Hardwood artifacts'
        # Every job builds its own dependency closure, so a Hardwood jar restored from
        # the cache can only stand in for one the closure failed to build, turning a
        # missing dependency into a silent compile against an earlier run's code.
        # Removing them makes such a gap a build error.
        run: rm -rf ~/.m2/repository/dev/hardwood

      - name: 'Build the dependencies'
        id: deps
        run: ./mvnw -ntp -B -Dquick install -pl :hardwood-s3,:hardwood-aws-auth,:hardwood-cli,:hardwood-parquet-java-compat -am

      - name: 'Build and install s3, aws-auth, cli and parquet-java-compat'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -B -fae clean install -pl :hardwood-s3,:hardwood-aws-auth,:hardwood-cli,:hardwood-parquet-java-compat

      - name: 'Compile predicate-audit'
        # The tool is in the reactor only under `-Ppredicate-audit`, and the `predicate-audit`
        # job runs it only for changes that can move its findings. It uses internal predicate
        # APIs that change, so this job, which has core and parquet-java at hand, compiles it
        # for every change.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -ntp -B -Ppredicate-audit compile -pl :hardwood-predicate-audit

      - name: 'Compile performance-testing'
        # These modules are in the reactor only under `-Pperformance-test`, so nothing
        # else in this workflow compiles them and an API change can pass the gate and
        # break `main`. Compiling is what catches that: every such break so far has
        # been a compile error. Running the benchmarks is a separate workflow — they
        # are slow and need ~100 MB per dataset — so this stops at `test-compile`, and
        # `testdata.download.skip` keeps any dataset from being fetched. Without
        # `-Dquick`, the `qa` profile covers these modules as it does every other one.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -ntp -B -Pperformance-test -Dtestdata.download.skip=true test-compile -pl :hardwood-performance-testing -amd

      - name: 'Check docs prose'
        if: ${{ !cancelled() }}
        run: python3 tools/docs-prose-check.py

  javadoc-and-integration-tests:
    name: 'Javadoc and integration tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Set up Java 25'
        # To build the dependencies: core carries a `src/main/java22` source root
        # compiled at `--release 22` into a multi-release jar, which javac 21 cannot
        # do. The Java 21 integration tests run on a JDK set up for them further down.
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5 — https://github.com/actions/setup-java/releases/tag/v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Restore Maven dependencies'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Drop any cached Hardwood artifacts'
        # Every job builds its own dependency closure, so a Hardwood jar restored from
        # the cache can only stand in for one the closure failed to build, turning a
        # missing dependency into a silent compile against an earlier run's code.
        # Removing them makes such a gap a build error.
        run: rm -rf ~/.m2/repository/dev/hardwood

      - name: 'Install libdeflate'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Freshly booted ubuntu-24.04 runners may still be running
          # unattended-upgrades, which holds /var/lib/dpkg/lock-frontend and
          # makes apt-get block indefinitely. Stop the service and wait for
          # the lock to clear before installing.
          #
          # Every wait here is bounded, because each one replaces an indefinite
          # apt-get block with a different indefinite block: `systemctl stop`
          # waits for the unit's in-flight transaction to finish, and a lock
          # that never clears would spin until the job's own timeout. A runner
          # that cannot be made ready must fail the step and say so, rather
          # than burn the job's wall clock in silence.
          #
          # The two waits are reported separately. A stop that times out still
          # leaves the lock held, so collapsing them would blame the loop for a
          # stall that happened before it — which is the misattribution this
          # step exists to avoid.
          stop_status=0
          sudo timeout 60 systemctl stop unattended-upgrades.service 2>/dev/null || stop_status=$?
          if [ "$stop_status" -eq 124 ]; then
            echo "::warning::systemctl stop unattended-upgrades did not complete within 60s; it may still hold the dpkg lock"
          fi
          for _ in $(seq 1 60); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "Waiting for dpkg lock..."
            sleep 2
          done
          if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
            echo "::error::dpkg lock still held after 120s; runner is not installable"
            exit 1
          fi
          sudo -E apt-get update
          sudo -E apt-get install -y libdeflate-dev

      - name: 'Build the dependencies'
        # The whole reactor, because `javadoc:javadoc` runs over all of it, except the
        # integration tests, which each run below compiles with the JDK it runs on.
        id: deps
        run: ./mvnw -ntp -B -Dquick install -pl '!:hardwood-integration-test'

      - name: 'Generate Javadoc'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -B javadoc:javadoc

      - name: 'Run integration tests (Java 25, libdeflate)'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -B clean verify -pl :hardwood-integration-test -Dlibdeflate.required=true -DargLine="--enable-native-access=ALL-UNNAMED"

      - name: 'Run integration tests (Java 25, libdeflate, incubating APIs)'
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -B clean verify -pl :hardwood-integration-test -Dlibdeflate.required=true -DargLine="--enable-native-access=ALL-UNNAMED --add-modules jdk.incubator.vector"

      - name: 'Set up Java 21'
        if: ${{ !cancelled() }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5 — https://github.com/actions/setup-java/releases/tag/v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 'Run integration tests (Java 21)'
        # Java 21 decompresses GZIP with the JDK's Inflater, so libdeflate being
        # installed on the runner does not change what this run exercises.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ./mvnw -B clean verify -pl :hardwood-integration-test

  # Verify the native CLI build on PRs
  native-build-check:
    if: github.event_name == 'pull_request'
    name: 'Verify native CLI build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          submodules: 'true'

      - name: 'Pre-pull s3proxy image in background'
        run: |
          nohup docker pull "$S3PROXY_IMAGE" > /tmp/s3proxy-pull.log 2>&1 &
          disown
          echo "Background pull of $S3PROXY_IMAGE started"

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@03e8abf916fd0e281b2efe7b2da3378bb0a1d085  # v1 — https://github.com/graalvm/setup-graalvm/releases/tag/v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Restore Maven dependencies'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-modules-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Drop any cached Hardwood artifacts'
        # Every job builds its own dependency closure, so a Hardwood jar restored from
        # the cache can only stand in for one the closure failed to build, turning a
        # missing dependency into a silent compile against an earlier run's code.
        # Removing them makes such a gap a build error.
        run: rm -rf ~/.m2/repository/dev/hardwood

      - name: 'Build the dependencies'
        run: ./mvnw -ntp -B -Dquick install -pl :hardwood-cli -am

      - name: 'Build Native Image'
        # -DskipSurefire=true skips the JVM unit test suite, which the `build-modules` job
        # runs. -Dnative clears the `native` tag exclusion so the ITs that spawn the
        # binary run at all; -Dgroups=native then holds failsafe to those eleven, since
        # the other 87 are the JVM S3 command ITs `build-modules` has already run, and
        # running them again here cost ten seconds for no additional coverage.
        #
        # Nothing here tunes native-image itself. Across eight runs of identical input
        # the image build took between 68 s and 124 s, so an option has to be worth
        # more than 1.8x to be visible at all, and neither -Ob nor a capped builder
        # heap was: -Ob moved more work into the analysis phase than it took out of
        # compilation, and the heap cap did not separate from the spread.
        run: ./mvnw -ntp -B -Dnative verify -pl :hardwood-cli -DskipSurefire=true -Dgroups=native

  predicate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6 — https://github.com/actions/checkout/releases/tag/v6
        with:
          fetch-depth: 0

      - name: 'Check whether the change can move the audit'
        # The audit takes a few minutes, so it runs only when the reader, the tool, its
        # fixture dependencies, the POMs that pin its build and the compared engines' versions,
        # or this workflow change. Keep the list in tools/predicate-audit/README.md in step.
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD \
              | grep -qE '^(core/src/main/|tools/predicate-audit/|tools/parquet_annotators\.py$|requirements\.txt$|pom\.xml$|core/pom\.xml$|test-bom/pom\.xml$|\.github/workflows/pr-build\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Set up Java'
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5 — https://github.com/actions/setup-java/releases/tag/v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Restore Maven dependencies'
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5 — https://github.com/actions/cache/releases/tag/v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ github.job }}-
            maven-${{ runner.os }}-build-modules-
            maven-${{ runner.os }}-build-core-
            maven-${{ runner.os }}-

      - name: 'Drop any cached Hardwood artifacts'
        if: steps.changes.outputs.run == 'true'
        # Every job builds its own dependency closure, so a Hardwood jar restored from
        # the cache can only stand in for one the closure failed to build, turning a
        # missing dependency into a silent compile against an earlier run's code.
        # Removing them makes such a gap a build error.
        run: rm -rf ~/.m2/repository/dev/hardwood

      - name: 'Set up the Python venv'
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -m venv .docker-venv
          .docker-venv/bin/pip install -q -r requirements.txt

      - name: 'Run the predicate audit'
        # Fails when the findings differ from tools/predicate-audit/baseline.tsv.
        if: steps.changes.outputs.run == 'true'
        env:
          PREDICATE_AUDIT_BUILD_TIMEOUT: '600'
        run: tools/predicate-audit/run.sh

      - name: 'Upload the audit report'
        if: steps.changes.outputs.run == 'true' && always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7 — https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: predicate-audit-report
          path: tools/predicate-audit/target/report/
          retention-days: 7
