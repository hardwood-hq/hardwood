# Points the CLI image's latest tag at an existing release, for when a release
# moved it to the wrong one (a fix release of an older line run with latest checked).
name: Retag Latest Image

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release whose image becomes latest (e.g. 1.1.0.Beta3)'
        required: true

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0 — https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: 'Point latest at the release image'
        env:
          VERSION: ${{ inputs.release-version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[A-Za-z]+[0-9]*$ ]]; then
            echo "Not a release version: $VERSION" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"
