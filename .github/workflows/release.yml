name: Release

# Pushing a release tag (tools/release/release.sh) builds the release, stages it on the
# Central Portal and smoke-tests the staged release; a maintainer then publishes or drops
# the deployment in the Portal. The signing key and the Central token are only in the
# `stage` job, which runs no build of the project. No job restores a cache.
on:
  push:
    tags:
      - 'v*'
      # Documentation tags (RELEASING.md).
      - '!v*-docs'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 'Check out the tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      - name: 'Check the tag and the release notes'
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+\.((Alpha|Beta|CR)[0-9]+|Final))$ ]]; then
            echo "Error: ${TAG} is not a release tag such as v1.1.0.CR2"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          pom_version="$(sed -n '0,/<version>/s|.*<version>\(.*\)</version>.*|\1|p' pom.xml)"
          if [[ "${pom_version}" != "${version}" ]]; then
            echo "Error: the POMs of ${TAG} are at ${pom_version}, not ${version}"
            exit 1
          fi
          tools/release/release-notes.sh "${version}" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 'Set up Java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0 — https://github.com/actions/setup-java/releases/tag/v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # The wrapper downloads Maven and checks it against the SHA-256 pinned in
      # .mvn/wrapper/maven-wrapper.properties; the download fails now and then, so it is
      # retried here rather than taken from a cache.
      - name: 'Download Maven'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q --version > /dev/null && exit 0
            echo "Downloading Maven failed (attempt ${attempt}); retrying"
            sleep 20
          done
          exit 1

      - name: 'Build'
        run: ./mvnw -ntp -B -Dquick -Pdeployment clean deploy

      - name: 'Hand over the staged artifacts'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: staging-deploy
          path: target/staging-deploy/
          if-no-files-found: error

  # Signs the staged artifacts and uploads them to the Central Portal with JReleaser, a
  # single JAR pinned by its SHA-256.
  stage:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    env:
      JRELEASER_VERSION: 1.27.0
      JRELEASER_SHA256: ed2c86583cca6fdbb9baaeaa2f135a10f7a74092b6200e0d604738b22c6bd52f
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: 'Check out the tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0 — https://github.com/actions/setup-java/releases/tag/v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Download the staged artifacts'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: staging-deploy
          path: target/staging-deploy

      - name: 'Download JReleaser'
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/jreleaser.jar" \
            "https://repo1.maven.org/maven2/org/jreleaser/jreleaser-tool-provider/${JRELEASER_VERSION}/jreleaser-tool-provider-${JRELEASER_VERSION}.jar"
          echo "${JRELEASER_SHA256}  ${RUNNER_TEMP}/jreleaser.jar" | sha256sum -c

      - name: 'Sign and upload to the Central Portal'
        run: java -jar "${RUNNER_TEMP}/jreleaser.jar" deploy --basedir . --config-file tools/release/jreleaser.yml --output-directory target
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.RELEASE_VERSION }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: 'JReleaser output'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: jreleaser
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties

  # Resolves the staged release from the Portal as a user's project does, with Maven and
  # the dependency plugin, which execute nothing they resolve. A job of its own, so that it
  # can be re-run without uploading again, and so that Maven never shares a job with the
  # signing key.
  resolve:
    needs: [ build, stage ]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: 'Check out the tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0 — https://github.com/actions/setup-java/releases/tag/v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      # The wrapper downloads Maven and checks it against the SHA-256 pinned in
      # .mvn/wrapper/maven-wrapper.properties; the download fails now and then, so it is
      # retried here rather than taken from a cache.
      - name: 'Download Maven'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q --version > /dev/null && exit 0
            echo "Downloading Maven failed (attempt ${attempt}); retrying"
            sleep 20
          done
          exit 1

      - name: 'Resolve the staged release'
        run: |
          MAVEN_CENTRAL_BEARER_TOKEN="$(printf '%s:%s' "${CENTRAL_USERNAME}" "${CENTRAL_TOKEN}" | base64 -w 0)"
          echo "::add-mask::${MAVEN_CENTRAL_BEARER_TOKEN}"
          export MAVEN_CENTRAL_BEARER_TOKEN
          tools/release/smoke-test/resolve.sh "${RELEASE_VERSION}" target/staged-classpath
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}

      - name: 'Hand over the resolved release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: staged-classpath
          path: target/staged-classpath/
          if-no-files-found: error

  # A user's program, run on the classpath resolved from the staged release. No secrets.
  smoke-test:
    needs: [ build, resolve ]
    runs-on: ubuntu-24.04
    steps:
      - name: 'Check out the tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0 — https://github.com/actions/setup-java/releases/tag/v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: 'Download the resolved release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: staged-classpath
          path: ${{ runner.temp }}/staged-classpath

      - name: 'Smoke test'
        run: java --enable-native-access=ALL-UNNAMED -cp "${RUNNER_TEMP}/staged-classpath/lib/*" tools/release/smoke-test/SmokeTest.java "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
