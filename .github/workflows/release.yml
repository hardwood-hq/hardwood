name: Release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version'
        required: true
      development-version:
        description: 'Development version'
        required: true
      stage:
        description: 'Stage ("UPLOAD" deploys to a staging repo, "FULL" publishes right away)'
        required: true
        type: choice
        options:
          - 'UPLOAD'
          - 'FULL'
      release-cli:
        description: 'Build and publish native CLI binaries'
        required: true
        type: boolean
        default: true
      latest:
        description: 'Mark as the latest release (GitHub release and :latest image); uncheck for a fix release of an older line'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # JReleaser closes the release's milestone.
      issues: write
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          submodules: 'true'

      - name: 'Set up Java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0 — https://github.com/actions/setup-java/releases/tag/v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: 'Configure git for CI'
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Action"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build Maven Central bearer token'
        if: inputs.stage == 'UPLOAD'
        run: |
          MAVEN_CENTRAL_BEARER_TOKEN=$(printf "%s:%s" "$MAVENCENTRAL_USERNAME" "$MAVENCENTRAL_TOKEN" | base64 -w 0)
          echo "::add-mask::$MAVEN_CENTRAL_BEARER_TOKEN"
          echo "MAVEN_CENTRAL_BEARER_TOKEN=$MAVEN_CENTRAL_BEARER_TOKEN" >> "$GITHUB_ENV"
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          MAVENCENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_TOKEN }}

      - name: 'Release'
        run: ./release.sh "${{ inputs.release-version }}" "${{ inputs.development-version }}" "${{ inputs.stage }}"
        env:
          RELEASE_LATEST: ${{ inputs.latest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'API change report'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: japicmp-report
          path: japicmp-report/

      - name: 'JReleaser output'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: jreleaser-release
          path: |
            target/checkout/target/jreleaser/trace.log
            target/checkout/target/jreleaser/output.properties


  release-cli:
    if: inputs.release-cli
    needs: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-cli.yml
    with:
      release-version: ${{ inputs.release-version }}
      latest: ${{ inputs.latest }}
