name: CLI Early Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          submodules: 'true'

      - name: 'Set up Java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0 — https://github.com/actions/setup-java/releases/tag/v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: 'Build and install modules'
        run: ./mvnw -ntp -B clean install

      - name: 'Upload built artifacts'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: maven-repo
          path: ~/.m2/repository/dev/hardwood/
          retention-days: 1

  package:
    needs: build
    name: 'Build native CLI on ${{ matrix.os }}'
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          submodules: 'true'

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173  # v1.6.7 — https://github.com/graalvm/setup-graalvm/releases/tag/v1.6.7
        with:
          version: '25i-latest'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: 'Block distrusted certificates in Graal'
        shell: bash
        run: tools/block-certificates.sh "$JAVA_HOME"

      - name: 'Download built artifacts'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: maven-repo
          path: ~/.m2/repository/dev/hardwood/

      - name: 'Build Native Image'
        run: ./mvnw -ntp -B -Dnative package -pl :hardwood-error-prone-checks,:hardwood-cli -DskipTests

      - name: 'Check the binary blocks every certificate in cli/src/main/trust/blocked.certs'
        shell: bash
        run: ./mvnw -ntp -B failsafe:integration-test failsafe:verify -pl :hardwood-cli -Dfailsafe.excludedGroups= -Dgroups=native '-Dit.test=NativeBinarySmokeIT#embedsEveryBlockedCertificate'

      - name: 'Upload build artifact (tar.gz)'
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: artifacts-${{ runner.os }}-${{ runner.arch }}
          path: cli/target/*.tar.gz

      - name: 'Upload build artifact (zip)'
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: artifacts-${{ runner.os }}-${{ runner.arch }}
          path: cli/target/*.zip

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          fetch-depth: 0

      - name: 'Download all build artifacts'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: 'Write checksums'
        working-directory: artifacts
        run: sha256sum -- * > checksums_sha256.txt

      - name: 'Attest build provenance'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2 — https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-checksums: artifacts/checksums_sha256.txt

      - name: 'List artifacts'
        run: ls -la artifacts/

      - name: 'Create or update early-access release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete 1.0-early-access --yes || true
          git tag -f 1.0-early-access
          git push -f origin 1.0-early-access
          gh release create 1.0-early-access \
            --title "1.0-early-access (CLI)" \
            --notes "Early-access build of the \`hardwood\` CLI, updated on every push to \`main\`.

          > **Warning**: This is a pre-release build and may be unstable.

          **Platforms:**
          - Linux x86_64
          - Linux aarch64
          - macOS aarch64 (Apple Silicon)
          - Windows x86_64" \
            --prerelease \
            artifacts/*

  docker:
    needs: package
    name: 'Build Docker image (${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: artifacts-Linux-X64
            arch: amd64
          - runner: ubuntu-24.04-arm
            artifact: artifacts-Linux-ARM64
            arch: arm64
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          submodules: 'true'

      - name: 'Download Linux artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: linux-artifact

      - name: 'Extract binary and completion script from tarball'
        run: |
          mkdir -p cli/target
          tar -xzf linux-artifact/*.tar.gz --wildcards --strip-components=2 \
            -C cli/target \
            '*/bin/hardwood' '*/bin/hardwood_completion'
          mv cli/target/hardwood cli/target/hardwood-cli

      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0 — https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      # Push by digest only (no per-arch tag); the manifest job stitches the
      # digests into the user-facing tag so no intermediate tags are published.
      - name: 'Build and push image by digest'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0 — https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: cli
          file: cli/docker/Dockerfile
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: 'Export digest'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 'Upload digest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: 'Download digests'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0 — https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: 'Create and push multi-arch manifest'
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do refs+=("ghcr.io/${{ github.repository }}@sha256:$digest"); done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:1.0-early-access \
            "${refs[@]}"

      - name: 'Resolve the image digest'
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:1.0-early-access" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Not an image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 'Attest build provenance'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2 — https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
