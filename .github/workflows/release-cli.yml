name: Release CLI

# Run by hand on the release tag (Use workflow from: Tags > v<version>) once the
# libraries are published on Maven Central; the version is the tag's. Builds and
# smoke-tests the native CLI on each platform and the container image, then creates the
# GitHub release with the archives and the version's release notes, closes the milestone
# and tags the image. A run of its own, so that nothing the libraries' build uploaded
# reaches it; no job restores a cache.
on:
  workflow_dispatch:
    inputs:
      latest:
        description: 'Mark the GitHub release and the image as latest; uncheck for a fix release of an older line'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 'Take the version from the tag'
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "${REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+\.((Alpha|Beta|CR)[0-9]+|Final))$ ]]; then
            echo "Error: run this workflow on a release tag such as v1.1.0.CR2, not ${REF}"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  # Builds and smoke-tests the native CLI on each platform, without write access. It
  # restores no cache.
  package:
    needs: validate
    name: 'Build with Graal on ${{ matrix.os }}'
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc  # v1.6.8 — https://github.com/graalvm/setup-graalvm/releases/tag/v1.6.8
        with:
          version: '25i-latest'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Block distrusted certificates in Graal'
        shell: bash
        run: tools/block-certificates.sh "$JAVA_HOME"

      # The wrapper downloads Maven and checks it against the SHA-256 pinned in
      # .mvn/wrapper/maven-wrapper.properties; the download fails now and then, so it is
      # retried here rather than taken from a cache.
      - name: 'Download Maven'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            ./mvnw -q --version > /dev/null && exit 0
            echo "Downloading Maven failed (attempt ${attempt}); retrying"
            sleep 20
          done
          exit 1

      - name: 'Build Native Image'
        shell: bash
        run: ./mvnw -ntp -B -Dnative install -pl :hardwood-error-prone-checks,:hardwood-cli -am -DskipTests "-Ddist.qualifier=${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}

      - name: 'Check the binary blocks every certificate in cli/src/main/trust/blocked.certs'
        shell: bash
        run: ./mvnw -ntp -B failsafe:integration-test failsafe:verify -pl :hardwood-cli -Dfailsafe.excludedGroups= -Dgroups=native '-Dit.test=NativeBinarySmokeIT#embedsEveryBlockedCertificate'

      - name: 'Smoke test the archive'
        shell: bash
        run: |
          shopt -s nullglob
          archives=(cli/target/hardwood-cli-"${RELEASE_VERSION}"-*.tar.gz cli/target/hardwood-cli-"${RELEASE_VERSION}"-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Error: expected one CLI archive in cli/target, found: ${archives[*]}"
            exit 1
          fi
          tools/release/cli-smoke-test.sh "${RELEASE_VERSION}" "${archives[0]}"
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}

      - name: 'Upload build artifact (tar.gz)'
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: artifacts-${{ runner.os }}-${{ runner.arch }}
          path: cli/target/*.tar.gz

      - name: 'Upload build artifact (zip)'
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: artifacts-${{ runner.os }}-${{ runner.arch }}
          path: cli/target/*.zip

  # Builds each architecture's image and pushes it by digest only: an untagged image,
  # which the publish job tags. Runs the pushed image.
  docker:
    needs: [ validate, package ]
    name: 'Build Docker image (${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: artifacts-Linux-X64
            arch: amd64
          - runner: ubuntu-24.04-arm
            artifact: artifacts-Linux-ARM64
            arch: arm64
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      - name: 'Download Linux artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: linux-artifact

      - name: 'Extract binary and completion script from tarball'
        run: |
          mkdir -p cli/target
          tar -xzf linux-artifact/*.tar.gz --wildcards --strip-components=2 \
            -C cli/target \
            '*/bin/hardwood' '*/bin/hardwood_completion'
          mv cli/target/hardwood cli/target/hardwood-cli

      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0 — https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: 'Build and push image by digest'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0 — https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: cli
          file: cli/docker/Dockerfile
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: 'Smoke test the pushed image'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          output="$(docker run --rm "ghcr.io/${REPOSITORY}@${DIGEST}" --version)"
          if [[ ! "${output}" =~ ^hardwood\ ${RELEASE_VERSION//./\\.}\  ]]; then
            echo "Error: the image reports '${output}', not ${RELEASE_VERSION}"
            exit 1
          fi
          echo "${output}"

      - name: 'Export digest'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: 'Upload digest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Long enough to re-run the publish job alone some days later.
          retention-days: 7

  # Tags the image, then creates the GitHub release with the archives, last, so that it is
  # complete once visible; every step can be re-run.
  publish:
    needs: [ validate, package, docker ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      # Closes the release's milestone.
      issues: write
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: 'Download amd64 digest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: digests-amd64
          path: ${{ runner.temp }}/digests

      - name: 'Download arm64 digest'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: digests-arm64
          path: ${{ runner.temp }}/digests

      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0 — https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: 'Create and push multi-arch manifest'
        working-directory: ${{ runner.temp }}/digests
        env:
          LATEST_TAG: ${{ inputs.latest && format('--tag ghcr.io/{0}:latest', github.repository) || '' }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          refs=()
          for digest in *; do refs+=("ghcr.io/${REPOSITORY}@sha256:$digest"); done
          if [[ ${#refs[@]} -ne 2 ]]; then
            echo "Error: expected the digests of two images, found ${#refs[@]}"
            exit 1
          fi
          # shellcheck disable=SC2086 # LATEST_TAG is empty or one --tag option
          docker buildx imagetools create \
            --tag "ghcr.io/${REPOSITORY}:${RELEASE_VERSION}" \
            $LATEST_TAG \
            "${refs[@]}"

      - name: 'Resolve the image digest'
        id: digest
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${REPOSITORY}:${RELEASE_VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Not an image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 'Attest image provenance'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2 — https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}

      # Each artifact by name, never by pattern: a job of the same run could have
      # uploaded more, and whatever is downloaded here gets attested and published.
      - name: 'Download Linux x64 build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: artifacts-Linux-X64
          path: artifacts

      - name: 'Download Linux ARM64 build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: artifacts-Linux-ARM64
          path: artifacts

      - name: 'Download macOS ARM64 build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: artifacts-macOS-ARM64
          path: artifacts

      - name: 'Download Windows x64 build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: artifacts-Windows-X64
          path: artifacts

      - name: 'Check the downloaded builds'
        working-directory: artifacts
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          expected="$(printf 'hardwood-cli-%s-%s\n' \
            "${RELEASE_VERSION}" linux-aarch64.tar.gz \
            "${RELEASE_VERSION}" linux-x86_64.tar.gz \
            "${RELEASE_VERSION}" macos-aarch64.tar.gz \
            "${RELEASE_VERSION}" windows-x86_64.zip | sort)"
          actual="$(find . -mindepth 1 -printf '%P\n' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Error: the downloaded builds are not exactly the four CLI archives:"
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi

      - name: 'Write checksums'
        working-directory: artifacts
        run: sha256sum -- * > checksums_sha256.txt

      - name: 'Attest build provenance'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2 — https://github.com/actions/attest-build-provenance/releases/tag/v4.2.2
        with:
          subject-checksums: artifacts/checksums_sha256.txt

      # gh uploads the assets to a draft and publishes it last. A re-run completes a draft
      # that an interrupted run left, and goes on to the milestone after a published one.
      - name: 'Create the GitHub release and close the milestone'
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          LATEST: ${{ inputs.latest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools/release/release-notes.sh "${RELEASE_VERSION}" > "${RUNNER_TEMP}/release-notes.md"
          if ! draft="$(gh release view "v${RELEASE_VERSION}" --json isDraft --jq .isDraft 2> /dev/null)"; then
            gh release create "v${RELEASE_VERSION}" --verify-tag --title "Release v${RELEASE_VERSION}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" --latest="${LATEST}" artifacts/*
          elif [[ "${draft}" == true ]]; then
            gh release upload "v${RELEASE_VERSION}" --clobber artifacts/*
            gh release edit "v${RELEASE_VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --draft=false --latest="${LATEST}"
          fi
          milestone="$(gh api "repos/${GH_REPO}/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${RELEASE_VERSION}\") | .number")"
          if [[ -n "${milestone}" ]]; then
            gh api -X PATCH "repos/${GH_REPO}/milestones/${milestone}" -f state=closed > /dev/null
          fi
