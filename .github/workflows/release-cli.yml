name: Release CLI

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version (must have an existing tag v<version>)'
        required: true
      latest:
        description: 'Tag the image as :latest; uncheck for a fix release of an older line'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      release-version:
        description: 'Release version (must have an existing tag v<version>)'
        required: true
        type: string
      latest:
        description: 'Tag the image as :latest'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: 'Verify GitHub release exists'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "v${{ inputs.release-version }}" &>/dev/null; then
            echo "Error: no GitHub release found for v${{ inputs.release-version }}"
            exit 1
          fi

  package:
    needs: validate
    name: 'Build with Graal on ${{ matrix.os }}'
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          ref: v${{ inputs.release-version }}
          submodules: 'true'

      - name: 'Set up Graal'
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173  # v1.6.7 — https://github.com/graalvm/setup-graalvm/releases/tag/v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: 'Block distrusted certificates in Graal'
        shell: bash
        run: tools/block-certificates.sh "$JAVA_HOME"

      - name: 'Build Native Image'
        run: ./mvnw -ntp -B -Dnative install -pl :hardwood-error-prone-checks,:hardwood-cli -am -DskipTests "-Ddist.qualifier=${{ inputs.release-version }}"

      - name: 'Check the binary blocks every certificate in cli/src/main/trust/blocked.certs'
        shell: bash
        run: ./mvnw -ntp -B failsafe:integration-test failsafe:verify -pl :hardwood-cli -Dfailsafe.excludedGroups= -Dgroups=native '-Dit.test=NativeBinarySmokeIT#embedsEveryBlockedCertificate'

      - name: 'Upload build artifact (tar.gz)'
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: artifacts-${{ runner.os }}-${{ runner.arch }}
          path: cli/target/*.tar.gz

      - name: 'Upload build artifact (zip)'
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: artifacts-${{ runner.os }}-${{ runner.arch }}
          path: cli/target/*.zip

  release-cli:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 'Download all build artifacts'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: 'Attach CLI binaries to release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v${{ inputs.release-version }}" artifacts/*

  docker:
    needs: package
    name: 'Build Docker image (${{ matrix.arch }})'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: artifacts-Linux-X64
            arch: amd64
          - runner: ubuntu-24.04-arm
            artifact: artifacts-Linux-ARM64
            arch: arm64
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0 — https://github.com/actions/checkout/releases/tag/v6.1.0
        with:
          ref: v${{ inputs.release-version }}
          submodules: 'true'

      - name: 'Download Linux artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: linux-artifact

      - name: 'Extract binary and completion script from tarball'
        run: |
          mkdir -p cli/target
          tar -xzf linux-artifact/*.tar.gz --wildcards --strip-components=2 \
            -C cli/target \
            '*/bin/hardwood' '*/bin/hardwood_completion'
          mv cli/target/hardwood cli/target/hardwood-cli

      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0 — https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      # Push by digest only (no per-arch tag); the manifest job stitches the
      # digests into the user-facing tags so no intermediate tags are published.
      - name: 'Build and push image by digest'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0 — https://github.com/docker/build-push-action/releases/tag/v7.4.0
        with:
          context: cli
          file: cli/docker/Dockerfile
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: 'Export digest'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 'Upload digest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Download digests'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0 — https://github.com/docker/login-action/releases/tag/v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1 — https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: 'Create and push multi-arch manifest'
        working-directory: ${{ runner.temp }}/digests
        env:
          LATEST_TAG: ${{ inputs.latest && format('--tag ghcr.io/{0}:latest', github.repository) || '' }}
        run: |
          # shellcheck disable=SC2086 # LATEST_TAG is empty or one --tag option
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ inputs.release-version }} \
            $LATEST_TAG \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
