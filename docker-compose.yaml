services:
  # Serves the S3 integration tests (see S3Proxy in test-support), so the claude
  # container needs no access to a Docker daemon. Tests write objects into
  # .s3proxy-data/, one bucket directory per test class. The port is published
  # on localhost so builds on the host can use this server as well. Keep the
  # image tag in sync with S3Proxy.IMAGE.
  s3proxy:
    image: ghcr.io/hardwood-hq/s3proxy:sha-6597ca59cd5c5fa8ee313e13d349d507cc6090c3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${S3PROXY_PORT:-8080}:80"
    volumes:
      - ./.s3proxy-data:/data:rw
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: access
      S3PROXY_CREDENTIAL: secret
      S3PROXY_ENDPOINT: http://0.0.0.0:80
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    networks:
      - claude-net

  # Holds the GitHub token and adds it to the claude container's requests to GitHub, so that nothing
  # in the claude container can read the token (see etc/dev-container/github-proxy/). Its CA
  # certificate and key stay in the github-proxy-conf volume, which the claude container does not
  # mount.
  github-proxy:
    build: etc/dev-container/github-proxy
    restart: unless-stopped
    volumes:
      - github-proxy-conf:/home/mitmproxy/.mitmproxy
    environment:
      - GH_TOKEN
    # The proxy exits when GH_TOKEN is unset; `docker compose logs github-proxy` says so.
    healthcheck:
      test: [ "CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1)" ]
      interval: 2s
      retries: 15
    networks:
      - claude-net

  claude:
    build: .
    entrypoint: [ "/usr/local/bin/claude-entrypoint", "claude" ]
    stdin_open: true  # -i
    tty: true         # -t
    depends_on:
      s3proxy:
        condition: service_started
      github-proxy:
        condition: service_healthy
    volumes:
      - .:/workspace
      - claude-config:/claude-config
      - maven-repo:/root/.m2
    environment:
      # gh refuses to run without a token; github-proxy replaces this placeholder with the real one.
      - GH_TOKEN=placeholder-replaced-by-github-proxy
      - HTTPS_PROXY=http://github-proxy:8080
      # Claude Code's runtime does not read the system trust store; claude-entrypoint installs this file.
      - NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/source/anchors/github-proxy.pem
      - COLORTERM=truecolor
      - CLAUDE_CONFIG_DIR=/claude-config
      - HARDWOOD_S3PROXY_ENDPOINT=http://s3proxy
      - HARDWOOD_S3PROXY_DATA_DIR=/workspace/.s3proxy-data
    networks:
      - claude-net

volumes:
  claude-config:
  maven-repo:
  github-proxy-conf:

networks:
  claude-net:
    driver: bridge
